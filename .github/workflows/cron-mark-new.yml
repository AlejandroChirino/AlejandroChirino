name: Mark expired `is_new`

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch: {}

jobs: 
  mark-expired:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ensure pnpm is available (corepack prepare, fallback to npm)
        run: |
          set -e
          echo "Trying corepack prepare pnpm@latest --activate"
          corepack enable || true
          corepack prepare pnpm@latest --activate || true
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found; installing via npm (force)"
            npm install -g pnpm@latest --force || true
          fi
          echo "pnpm version: $(pnpm --version || echo 'not-found')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run mark-new-expired script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node ./scripts/mark-new-expired.js
